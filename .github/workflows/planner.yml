name: Planner Backend

on:
  repository_dispatch:
    types:
      - planner_run
  workflow_dispatch:
    inputs:
      project_id:
        description: "Project ID"
        required: true
      action:
        description: "start or resume"
        required: true
        default: "start"
      openrouter_key:
        description: "OpenRouter API Key"
        required: false

concurrency:
  group: planner-${{ github.event.client_payload.project_id || github.event.inputs.project_id }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code (main branch)
        uses: actions/checkout@v4
        with:
          ref: main
          path: code

      - name: Checkout data branch (planner-data)
        uses: actions/checkout@v4
        with:
          ref: planner-data
          path: data

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run orchestrator
        env:
          OPENROUTER_API_KEY: ${{ github.event.client_payload.openrouter_key || github.event.inputs.openrouter_key || secrets.OPENROUTER_API_KEY }}
          PROJECT_ID: ${{ github.event.client_payload.project_id || github.event.inputs.project_id }}
          ACTION: ${{ github.event.client_payload.action || github.event.inputs.action || 'start' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
        run: |
          python code/backend/run.py \
            --data-dir data \
            --project-id "$PROJECT_ID" \
            --action "$ACTION"
