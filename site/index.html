<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Planning Council v0</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 760px; margin: 0 auto; }
    h1 { font-size: 1.3rem; font-weight: 600; color: #7dd3fc; letter-spacing: 0.04em; margin-bottom: 6px; }
    .subtitle { font-size: 0.78rem; color: #555; margin-bottom: 32px; }
    label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 6px; letter-spacing: 0.05em; text-transform: uppercase; }
    input[type="text"], input[type="password"], textarea {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      color: #e0e0e0;
      font-family: inherit;
      font-size: 0.88rem;
      padding: 10px 12px;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 18px;
    }
    input:focus, textarea:focus { border-color: #7dd3fc; }
    textarea { resize: vertical; min-height: 100px; }
    button {
      background: #7dd3fc;
      color: #0d0d0d;
      border: none;
      border-radius: 6px;
      padding: 10px 24px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:hover { background: #93d9fd; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status-section { margin-top: 32px; display: none; }
    .status-bar { display: flex; align-items: center; gap: 10px; font-size: 0.82rem; color: #aaa; margin-bottom: 16px; }
    .spinner { width: 14px; height: 14px; border: 2px solid #333; border-top-color: #7dd3fc; border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .stage-label { font-size: 0.78rem; color: #7dd3fc; font-weight: 600; letter-spacing: 0.04em; margin-bottom: 10px; }
    .steps-list { list-style: none; font-size: 0.78rem; color: #555; margin-bottom: 20px; line-height: 1.8; }
    .steps-list li.done { color: #4ade80; }
    .steps-list li.done::before { content: "✓ "; }
    .steps-list li.active { color: #7dd3fc; }
    .steps-list li.active::before { content: "▶ "; }
    #events-log { background: #111; border: 1px solid #222; border-radius: 6px; padding: 12px; font-size: 0.73rem; color: #555; max-height: 120px; overflow-y: auto; margin-bottom: 20px; font-family: monospace; line-height: 1.6; }
    #result-section { display: none; margin-top: 12px; }
    #plan-output { background: #111; border: 1px solid #2a2a2a; border-radius: 6px; padding: 20px; font-size: 0.84rem; line-height: 1.7; white-space: pre-wrap; word-break: break-word; color: #d0d0d0; max-height: 70vh; overflow-y: auto; }
    .error-box { background: #1a0a0a; border: 1px solid #4a1a1a; border-radius: 6px; padding: 14px; color: #f87171; font-size: 0.82rem; margin-bottom: 16px; }
    .retry-btn { background: #374151; color: #e0e0e0; font-size: 0.78rem; padding: 7px 16px; margin-left: 10px; }
    .section-title { font-size: 0.78rem; color: #555; letter-spacing: 0.06em; text-transform: uppercase; margin-bottom: 8px; }
    .divider { border: none; border-top: 1px solid #1e1e1e; margin: 24px 0; }
    #project-id-display { font-size: 0.72rem; color: #333; font-family: monospace; margin-bottom: 8px; }
  </style>
</head>
<body>
<div class="container">
  <h1>Planning Council v0</h1>
  <p class="subtitle">Sequential AI planning council — testing version</p>

  <label for="gh-token">GitHub Token</label>
  <input type="password" id="gh-token" placeholder="ghp_..." autocomplete="off" />

  <label for="or-key">OpenRouter API Key</label>
  <input type="password" id="or-key" placeholder="sk-or-..." autocomplete="off" />

  <label for="prompt-input">Planning Goal</label>
  <textarea id="prompt-input" placeholder="Describe what you want to plan or build..."></textarea>

  <button id="run-btn" onclick="startRun()">Run Planning Council</button>

  <hr class="divider" />

  <div id="status-section">
    <div id="project-id-display"></div>
    <div class="status-bar">
      <div class="spinner" id="spinner"></div>
      <span id="status-text">Initializing...</span>
    </div>
    <div class="stage-label" id="stage-label"></div>
    <ul class="steps-list" id="steps-list"></ul>
    <div class="section-title">Log</div>
    <div id="events-log"></div>
    <div id="error-box" class="error-box" style="display:none">
      <span id="error-msg"></span>
      <button class="retry-btn" onclick="retryRun()">Retry</button>
    </div>
  </div>

  <div id="result-section">
    <div class="section-title" style="margin-bottom:12px">Final Plan</div>
    <div id="plan-output"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
